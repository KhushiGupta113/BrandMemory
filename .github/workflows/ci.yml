name: BrandMemory CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      EMBEDDING_PROVIDER: demo
      LLM_PROVIDER: demo
      DEFAULT_WORKSPACE_ID: ws-kalyani-botanicals
      JWT_SECRET: ci-test-secret-min-32-chars-long-placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit & RAG test suite
        run: npm test

      - name: Build Next.js application
        run: npm run build
